<!DOCTYPE html>
<!-- Dark from the first paint. Set as attributes: an inline <style> here trips a Vite
     build bug when the project path's drive letter casing varies. -->
<html lang="en" class="pixel-theme" style="background: #050d14">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" type="image/png" href="/images/favicon_new.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evan Chen Portfolio</title>
  <!-- The pixel reef is the default page: start dark, with its fonts on the way,
       so the first paint already looks like it. -->
  <link rel="preload" href="/fonts/press-start-2p.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/vt323.woff2" as="font" type="font/woff2" crossorigin />
</head>

<body style="background: #050d14">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
